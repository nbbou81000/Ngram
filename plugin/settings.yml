strategy: polling
polling_verb: get

# Le polling ne va chercher que l'INDEX : quelques centaines d'octets listant
# les écrans disponibles. Le transform (serverless Python) y tire un écran au
# sort et va le chercher. Aucun cron : le tirage a lieu à chaque
# rafraîchissement, donc un réglage à 5 minutes donne un écran neuf toutes les
# 5 minutes.
polling_url: https://nbbou81000.github.io/Ngram/api/index-{{ mode }}-{{ langue }}.json
polling_body: ''

# L'écran est une composition pleine page : pas de marge, pas de barre de titre.
no_screen_padding: 'yes'
dark_mode: 'no'

custom_fields:

 - keyname: about
  field_type: author_bio
  name: "How it works / Le principe"
  category: education,discovery
  github_url: "https://github.com/nbbou81000/Ngram"
  email_address: "nb.bouteiller@gmail.com"
  description: "Google digitised millions of books published between 1800 and 2019 and counted every word, year by year. You can follow a word through two centuries of print: watch it appear, peak, fade, sometimes return.<br><br>Google a numerise des millions de livres publies entre 1800 et 2019, puis compte chaque mot, annee par annee. On peut suivre un mot sur deux siecles d'imprime : le voir apparaitre, culminer, decliner, parfois revenir."
  help_text: "One picture a day. No statistics to decode: a curve, a word, a date. The corpus stops in 2019 and everything is computed in advance, so the screen depends on no live service.<br><br>Une image par jour. Pas de statistiques a dechiffrer : une courbe, un mot, une date. Source : Google Books Ngram Viewer."
- keyname: langue
  field_type: select
  name: "Corpus language / Langue du corpus"
  description: "Sets both the books searched and the language on screen."
  help_text: "English draws on a far larger corpus: smoother curves, more words.<br>Le corpus anglais est plus vaste : courbes plus lisses, plus de mots."
  options:
    - "English: en"
    - "Francais: fr"
  default: "en"
- keyname: mode
  field_type: select
  name: "What the screen tells you / Ce que l'ecran raconte"
  description: "One corpus, five ways of looking at it."
  help_text: "<b>Surprise me</b> - a different mode every refresh.<br><b>A forgotten word</b> - peaked then collapsed.<br><b>The word appears</b> - when it entered the language.<br><b>The comeback</b> - forgotten, then revived. The rarest.<br><b>Vintage year</b> - every word born in one year.<br><b>Two languages</b> - the same word in French and English."
  options:
    - "Surprise me / Surprends-moi: rotation"
    - "A forgotten word / Le mot oublie: oublie"
    - "The word appears / Le mot est ne: naissance"
    - "The comeback / La resurrection: resurrection"
    - "Vintage year / Le millesime: millesime"
    - "Two languages / Deux langues: bilingue"
  default: "rotation"
